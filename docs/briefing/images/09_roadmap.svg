<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif"><rect width="1920" height="1080" fill="#FFFFFF"/><rect x="60" y="110" width="1150" height="750" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" /><text x="90" y="158" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start" >완성 모습</text><text x="232" y="157" font-size="19" font-weight="400" fill="#64748B" text-anchor="start" >로드맵 1 – 15단계</text><rect x="1235" y="110" width="625" height="750" rx="24" fill="#F8FBFF" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 7" /><text x="1265" y="158" font-size="28" font-weight="700" fill="#1E40AF" text-anchor="start" >다음 비전</text><line x1="90" y1="490" x2="1205" y2="490" stroke="#0F172A" stroke-width="4"/><path d="M1240.0,490.0 L1827.4,490.0" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round" stroke-dasharray="12 9"/><polygon points="1845.0,490.0 1823.0,499.2 1823.0,480.8" fill="#2563EB"/><rect x="85.0" y="230" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" /><text x="107.0" y="274" font-size="23" font-weight="700" fill="#0F172A" text-anchor="start" >일일 알람 리포트</text><text x="107.0" y="318" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >28개 사이트를 매일 집계해</text><text x="107.0" y="348" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >아침마다 메일로</text><line x1="235" y1="400" x2="235" y2="468" stroke="#94A3B8" stroke-width="2"/><circle cx="235" cy="490" r="22" fill="#0F172A"/><text x="235" y="497" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" >1</text><rect x="244.0" y="580" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" /><text x="266.0" y="624" font-size="23" font-weight="700" fill="#0F172A" text-anchor="start" >자동 탐지</text><text x="266.0" y="668" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >정기 순찰로 이상을 찾고</text><text x="266.0" y="698" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >같은 문제는 한 사건으로</text><line x1="394" y1="512" x2="394" y2="580" stroke="#94A3B8" stroke-width="2"/><circle cx="394" cy="490" r="22" fill="#0F172A"/><text x="394" y="497" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" >2</text><rect x="403.0" y="230" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" /><text x="425.0" y="274" font-size="23" font-weight="700" fill="#0F172A" text-anchor="start" >AI 조사</text><text x="425.0" y="318" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >데이터·코드·재계산으로</text><text x="425.0" y="348" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >원인을 거슬러 추적</text><line x1="553" y1="400" x2="553" y2="468" stroke="#94A3B8" stroke-width="2"/><circle cx="553" cy="490" r="22" fill="#0F172A"/><text x="553" y="497" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" >3</text><rect x="562.0" y="580" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" /><text x="584.0" y="624" font-size="23" font-weight="700" fill="#0F172A" text-anchor="start" >판정 · 보고</text><text x="584.0" y="668" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >근거 검증을 거친 결론을</text><text x="584.0" y="698" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >보고서로 전달</text><line x1="712" y1="512" x2="712" y2="580" stroke="#94A3B8" stroke-width="2"/><circle cx="712" cy="490" r="22" fill="#0F172A"/><text x="712" y="497" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" >4</text><rect x="721.0" y="230" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" /><text x="743.0" y="274" font-size="23" font-weight="700" fill="#0F172A" text-anchor="start" >사람과 문답</text><text x="743.0" y="318" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >조사 중 필요한 것을 묻고</text><text x="743.0" y="348" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >답을 받아 이어 간다</text><line x1="871" y1="400" x2="871" y2="468" stroke="#94A3B8" stroke-width="2"/><circle cx="871" cy="490" r="22" fill="#0F172A"/><text x="871" y="497" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" >5</text><rect x="880.0" y="580" width="300" height="170" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" /><text x="902.0" y="624" font-size="23" font-weight="700" fill="#0F172A" text-anchor="start" >상주 운영 · 정확도 측정</text><text x="902.0" y="668" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >사람이 안 불러도 돌고,</text><text x="902.0" y="698" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >실제 원인과 맞는지 잰다</text><line x1="1030" y1="512" x2="1030" y2="580" stroke="#94A3B8" stroke-width="2"/><circle cx="1030" cy="490" r="22" fill="#0F172A"/><text x="1030" y="497" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" >6</text><rect x="1255.0" y="230" width="290" height="170" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" /><text x="1277.0" y="274" font-size="23" font-weight="700" fill="#1E40AF" text-anchor="start" >웹 질의 창구</text><text x="1277.0" y="318" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >웹에서 묻고, 진행을 보며</text><text x="1277.0" y="348" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >원인 후보를 받는다</text><line x1="1400" y1="400" x2="1400" y2="468" stroke="#2563EB" stroke-width="2"/><circle cx="1400" cy="490" r="22" fill="#fff" stroke="#2563EB" stroke-width="3" stroke-dasharray="5 4"/><text x="1400" y="497" font-size="17" font-weight="700" fill="#1E40AF" text-anchor="middle" >V1</text><rect x="1407.0" y="580" width="290" height="170" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" /><text x="1429.0" y="624" font-size="23" font-weight="700" fill="#1E40AF" text-anchor="start" >학습 루프</text><text x="1429.0" y="668" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >실제 원인을 기록해 정확도를</text><text x="1429.0" y="698" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >재고 다음 조사에 쓴다</text><line x1="1552" y1="512" x2="1552" y2="580" stroke="#2563EB" stroke-width="2"/><circle cx="1552" cy="490" r="22" fill="#fff" stroke="#2563EB" stroke-width="3" stroke-dasharray="5 4"/><text x="1552" y="497" font-size="17" font-weight="700" fill="#1E40AF" text-anchor="middle" >V2</text><rect x="1560.0" y="230" width="290" height="170" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" /><text x="1582.0" y="274" font-size="23" font-weight="700" fill="#1E40AF" text-anchor="start" >조사 범위 확장</text><text x="1582.0" y="318" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >로그·지표 읽기,</text><text x="1582.0" y="348" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >여러 사이트 공통 장애 묶기</text><line x1="1705" y1="400" x2="1705" y2="468" stroke="#2563EB" stroke-width="2"/><circle cx="1705" cy="490" r="22" fill="#fff" stroke="#2563EB" stroke-width="3" stroke-dasharray="5 4"/><text x="1705" y="497" font-size="17" font-weight="700" fill="#1E40AF" text-anchor="middle" >V3</text><rect x="60" y="896" width="1800" height="110" rx="20" fill="#0F172A" stroke="#0F172A" stroke-width="2" /><g transform="translate(96,933) scale(1.5)" fill="none" stroke="#FFFFFF" color="#FFFFFF" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="150" y="942" font-size="19" font-weight="700" fill="#94A3B8" text-anchor="start" >모든 단계에서 그대로</text><text x="150" y="980" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start" >읽기 전용  ·  조치는 사람이  ·  근거 없는 결론은 내지 않는다</text></svg>