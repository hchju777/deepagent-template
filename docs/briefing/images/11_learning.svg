<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif"><rect width="1920" height="1080" fill="#FFFFFF"/><circle cx="590" cy="450" r="292" fill="none" stroke="#E2E8F0" stroke-width="2"/><path d="M785.4,233.0 A292,292 0 0 1 864.4,350.1" fill="none" stroke="#64748B" stroke-width="3"/><polygon points="870.7,369.5 857.7,355.0 872.0,350.0" fill="#64748B"/><path d="M870.7,530.5 A292,292 0 0 1 800.0,652.8" fill="none" stroke="#64748B" stroke-width="3"/><polygon points="785.4,667.0 792.8,648.9 803.5,659.6" fill="#64748B"/><path d="M394.6,667.0 A292,292 0 0 1 315.6,549.9" fill="none" stroke="#64748B" stroke-width="3"/><polygon points="309.3,530.5 322.3,545.0 308.0,550.0" fill="#64748B"/><path d="M309.3,369.5 A292,292 0 0 1 380.0,247.2" fill="none" stroke="#64748B" stroke-width="3"/><polygon points="394.6,233.0 387.2,251.1 376.5,240.4" fill="#64748B"/><rect x="435.0" y="100.0" width="310" height="116" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" /><g transform="translate(455.0,120.0) scale(1.1666666666666667)" fill="none" stroke="#2563EB" color="#2563EB" stroke-width="1.886" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g><text x="493.0" y="144.0" font-size="23" font-weight="700" fill="#1E40AF" text-anchor="start" >AI가 조사 · 판정</text><text x="455.0" y="180.0" font-size="17" font-weight="400" fill="#334155" text-anchor="start" >원인 후보와 신뢰도를 낸다</text><rect x="727.0" y="392.0" width="310" height="116" rx="16" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" /><g transform="translate(747.0,412.0) scale(1.1666666666666667)" fill="none" stroke="#0F766E" color="#0F766E" stroke-width="1.886" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.3"/></g><text x="785.0" y="436.0" font-size="23" font-weight="700" fill="#115E59" text-anchor="start" >실제 원인 기록</text><text x="747.0" y="472.0" font-size="17" font-weight="400" fill="#334155" text-anchor="start" >조치한 담당자가 한 번 누른다</text><text x="747.0" y="496.0" font-size="17" font-weight="400" fill="#334155" text-anchor="start" >맞음 · 일부 · 틀림 · 모름</text><rect x="435.0" y="684.0" width="310" height="116" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2.5" /><g transform="translate(455.0,704.0) scale(1.1666666666666667)" fill="none" stroke="#475569" color="#475569" stroke-width="1.886" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></g><text x="493.0" y="728.0" font-size="23" font-weight="700" fill="#1E293B" text-anchor="start" >정확도 측정</text><text x="455.0" y="764.0" font-size="17" font-weight="400" fill="#334155" text-anchor="start" >‘높음’이라 한 것은 실제로</text><text x="455.0" y="788.0" font-size="17" font-weight="400" fill="#334155" text-anchor="start" >얼마나 맞았나</text><rect x="143.0" y="392.0" width="310" height="116" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2.5" /><g transform="translate(163.0,412.0) scale(1.1666666666666667)" fill="none" stroke="#475569" color="#475569" stroke-width="1.886" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 11h18"/></g><text x="201.0" y="436.0" font-size="23" font-weight="700" fill="#1E293B" text-anchor="start" >과거 사건을 출발점으로</text><text x="163.0" y="472.0" font-size="17" font-weight="400" fill="#334155" text-anchor="start" >비슷한 사건을 다음 조사의</text><text x="163.0" y="496.0" font-size="17" font-weight="400" fill="#334155" text-anchor="start" >참고로 보여 준다</text><g transform="translate(568,366) scale(1.8333333333333333)" fill="none" stroke="#0F172A" color="#0F172A" stroke-width="1.309" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></g><text x="590" y="452" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle" >기록이 쌓일수록</text><text x="590" y="484" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle" >얼마나 맞히는지</text><text x="590" y="516" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle" >보인다</text><rect x="1150" y="90" width="710" height="650" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" /><text x="1182" y="140" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start" >또 하나의 순환 — 규칙으로 돌려보내기</text><rect x="1182" y="176" width="570" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2" /><g transform="translate(1204,200) scale(1.1666666666666667)" fill="none" stroke="#2563EB" color="#2563EB" stroke-width="1.886" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g><text x="1244" y="224" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="start" >AI 조사가 규칙에 없던 이상 유형을 찾는다</text><text x="1204" y="276" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >예: 합계는 정상인데 한 갈래만 멈춰 있다</text><path d="M1467.0,318.0 L1467.0,352.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1467.0,364.0 1460.7,349.0 1473.3,349.0" fill="#64748B"/><rect x="1182" y="366" width="570" height="140" rx="16" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.2" /><g transform="translate(1204,390) scale(1.1666666666666667)" fill="none" stroke="#0F766E" color="#0F766E" stroke-width="1.886" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="1244" y="414" font-size="21" font-weight="700" fill="#115E59" text-anchor="start" >담당자가 그 유형을 규칙 점검으로 등록한다</text><text x="1204" y="466" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >설정 한 줄 — 넣을지는 사람이 정한다</text><path d="M1467.0,508.0 L1467.0,542.0" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1467.0,554.0 1460.7,539.0 1473.3,539.0" fill="#64748B"/><rect x="1182" y="556" width="570" height="140" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2.2" /><g transform="translate(1204,580) scale(1.1666666666666667)" fill="none" stroke="#475569" color="#475569" stroke-width="1.886" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/><circle cx="12" cy="12" r="1" fill="currentColor"/></g><text x="1244" y="604" font-size="21" font-weight="700" fill="#1E293B" text-anchor="start" >다음부터는 규칙 점검이 바로 잡는다</text><text x="1204" y="656" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >더 자주 돌고, AI를 부르지 않는다</text><path d="M1752.0,626.0 L1800.0,626.0 L1800.0,246.0 L1766.0,246.0" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="1754.0,246.0 1769.0,239.7 1769.0,252.3" fill="#2563EB"/><text x="1826" y="436" font-size="17" font-weight="700" fill="#1E40AF" text-anchor="middle" transform="rotate(90 1826 436)">AI는 새로운 유형에 집중</text><rect x="60.0" y="866" width="580.0" height="160" rx="16" fill="#fff" stroke="#475569" stroke-width="2" /><g transform="translate(84.0,888) scale(1.0833333333333333)" fill="none" stroke="#475569" color="#475569" stroke-width="2.031" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="122.0" y="910" font-size="22" font-weight="700" fill="#1E293B" text-anchor="start" >숫자를 서두르지 않는다</text><text x="84.0" y="956" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >기록 30건 이상, 종결의 절반 이상이</text><text x="84.0" y="984" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >기록된 뒤에만 정확도를 계산한다</text><rect x="670.0" y="866" width="580.0" height="160" rx="16" fill="#fff" stroke="#475569" stroke-width="2" /><g transform="translate(694.0,888) scale(1.0833333333333333)" fill="none" stroke="#475569" color="#475569" stroke-width="2.031" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/></g><text x="732.0" y="910" font-size="22" font-weight="700" fill="#1E293B" text-anchor="start" >과거는 출발점일 뿐</text><text x="694.0" y="956" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >결론은 이번 사건의 증거로만 낸다 —</text><text x="694.0" y="984" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >비슷한 증상이 같은 원인은 아니다</text><rect x="1280.0" y="866" width="580.0" height="160" rx="16" fill="#fff" stroke="#475569" stroke-width="2" /><g transform="translate(1304.0,888) scale(1.0833333333333333)" fill="none" stroke="#475569" color="#475569" stroke-width="2.031" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="1342.0" y="910" font-size="22" font-weight="700" fill="#1E293B" text-anchor="start" >자동 조정은 없다</text><text x="1304.0" y="956" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >숫자를 보고 설정을 바꾸는 것은</text><text x="1304.0" y="984" font-size="18" font-weight="400" fill="#334155" text-anchor="start" >사람이다</text></svg>