[pytest]
testpaths = tests
asyncio_mode = auto

# 기본 실행에서 live_llm을 뺀다. 이 리포의 축은 "실제 시스템도, 실제 LLM도
# 요구하지 않는다"이고 CI는 사내망 밖에서도 돌아야 한다. 사내에서 실제
# 게이트웨이에 물어보려면 명령줄에서 -m을 덮어쓴다:
#     pytest tests/live -m live_llm
addopts = -m "not live_llm"
markers =
    live_llm: 사내 LLM 게이트웨이에 실제로 질의한다(사내망에서만 통과, 기본 제외)
